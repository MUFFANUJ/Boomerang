{{- $name := include "boomerang.fullname" . }}
{{- if .Values.worker.keda.enabled }}
# Workers scale on Kafka consumer lag of the delivery group: a backlog adds workers before CPU
# would ever notice, and partitions cap useful parallelism.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}-worker
  labels: {{- include "boomerang.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ $name }}-worker
  minReplicaCount: {{ .Values.worker.keda.minReplicas }}
  maxReplicaCount: {{ .Values.worker.keda.maxReplicas }}
  pollingInterval: {{ .Values.worker.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.worker.keda.cooldownPeriod }}
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ .Values.external.kafkaBrokers | quote }}
        consumerGroup: boomerang-delivery
        topic: boomerang.deliveries
        lagThreshold: {{ .Values.worker.keda.lagThreshold | quote }}
        offsetResetPolicy: earliest
{{- end }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-api
  labels: {{- include "boomerang.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }}-api }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPU }} } }
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-worker
  labels: {{- include "boomerang.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "boomerang.selector" (dict "root" . "component" "worker") | nindent 6 }}
