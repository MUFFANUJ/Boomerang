{{- if .Values.ingress.enabled }}
{{- $name := include "boomerang.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels: {{- include "boomerang.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - { path: /v1, pathType: Prefix, backend: { service: { name: {{ $name }}-api, port: { number: 8080 } } } }
          - { path: /api/overview, pathType: Exact, backend: { service: { name: {{ $name }}-realtime, port: { number: 8080 } } } }
          - { path: /api/integrity, pathType: Exact, backend: { service: { name: {{ $name }}-realtime, port: { number: 8080 } } } }
          - { path: /api/infra, pathType: Exact, backend: { service: { name: {{ $name }}-realtime, port: { number: 8080 } } } }
          {{- if .Values.demo.shopsim }}
          - { path: /api/sim, pathType: Prefix, backend: { service: { name: {{ $name }}-shopsim, port: { number: 8080 } } } }
          {{- end }}
          - { path: /api, pathType: Prefix, backend: { service: { name: {{ $name }}-api, port: { number: 8080 } } } }
          - { path: /ws, pathType: Exact, backend: { service: { name: {{ $name }}-realtime, port: { number: 8080 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: {{ $name }}-web, port: { number: 80 } } } }
{{- end }}
