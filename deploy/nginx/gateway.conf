# Boomerang edge: load balancer + API gateway.
# - Spreads /v1 and /api across every `api` replica (Docker DNS returns one A record per replica).
# - Enforces request size limits and per-client connection limits.
# - Routes the WebSocket stream, ShopSim controls and the dashboard.
# API-key authentication and per-tenant rate limiting happen in the API service against Redis,
# so limits are shared exactly across replicas.

log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                            '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                            '"rt":$request_time,"upstream":"$upstream_addr","urt":"$upstream_response_time"}';
access_log /dev/stdout json;

resolver 127.0.0.11 valid=10s ipv6=off;

limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream api {
    zone api 64k;
    server api:8080 resolve;
    keepalive 128;
}
upstream realtime {
    zone realtime 64k;
    server realtime:8080 resolve;
}
upstream shopsim {
    zone shopsim 64k;
    server shopsim:8080 resolve;
    keepalive 16;
}
upstream web {
    zone web 64k;
    server web:80 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    client_max_body_size 8m;
    limit_conn perip 2000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Public ingestion API.
    location /v1/ {
        proxy_pass http://api;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    # Live snapshots are served by the realtime service.
    location = /api/overview  { proxy_pass http://realtime; }
    location = /api/integrity { proxy_pass http://realtime; }
    location = /api/infra     { proxy_pass http://realtime; }

    location /api/sim/ { proxy_pass http://shopsim; }

    location /api/ {
        proxy_pass http://api;
        proxy_read_timeout 120s; # scaling workers can take a while
    }

    location /ws {
        proxy_pass http://realtime;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Internal endpoints are never exposed.
    location /internal/ { return 404; }

    location / {
        proxy_pass http://web;
    }
}
