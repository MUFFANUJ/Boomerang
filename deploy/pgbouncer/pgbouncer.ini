; Transaction pooling keeps Postgres connection count flat no matter how many API replicas run.
[databases]
boomerang = host=postgres port=5432 dbname=boomerang

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
min_pool_size = 2
server_reset_query =
ignore_startup_parameters = extra_float_digits
logfile =
log_connections = 0
log_disconnections = 0
