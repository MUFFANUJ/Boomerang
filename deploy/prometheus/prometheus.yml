global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  # Discover every Boomerang container (including workers added from the dashboard).
  - job_name: boomerang
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=boomerang"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: api|fanout|worker|retry|recorder|realtime|shopsim
        action: keep
      - source_labels: [__meta_docker_port_private]
        regex: "8080"
        action: keep
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: instance
