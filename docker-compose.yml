# Boomerang: the whole platform, one command.
#   docker compose up -d --build                           # core platform + dashboard on http://localhost:8080
#   docker compose --profile observability up -d          # + Prometheus, Grafana, Loki, Jaeger
name: boomerang

x-backend: &backend
  image: boomerang-backend:local
  pull_policy: never # built locally by the `init` service
  restart: unless-stopped
  depends_on:
    init:
      condition: service_completed_successfully
  environment: &backend-env
    DEMO_MODE: "true"
    LOG_LEVEL: info
    KAFKA_BROKERS: kafka:9092
    REDIS_ADDR: redis:6379
    POSTGRES_URL: postgres://boomerang:boomerang@pgbouncer:6432/boomerang?sslmode=disable
    POSTGRES_DIRECT_URL: postgres://boomerang:boomerang@postgres:5432/boomerang?sslmode=disable
    CLICKHOUSE_URL: http://clickhouse:8123
    MINIO_ENDPOINT: s3:8333
    MINIO_ACCESS_KEY: boomerang
    MINIO_SECRET_KEY: boomerang-secret
    SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-dev-only-secrets-key-change-me}
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
    SHOPSIM_API_KEY: ${SHOPSIM_API_KEY:-bmr_live_shopsim_demo_key_0000000000000000}
    SSRF_ALLOW_HOSTS: receivers
    RECEIVERS_URL: http://receivers:9000
    API_INTERNAL_URL: http://api:8080
    GATEWAY_URL: http://gateway
    DELIVERY_TIMEOUT: 5s
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
    GOMEMLIMIT: 192MiB
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
    interval: 10s
    timeout: 3s
    retries: 5
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # ---------------------------------------------------------------- infrastructure
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 12
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    ports: ["29092:29092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boomerang
      POSTGRES_PASSWORD: boomerang
      POSTGRES_DB: boomerang
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boomerang"]
      interval: 5s
      retries: 20
    logging: *logging

  pgbouncer:
    build: ./deploy/pgbouncer
    image: boomerang-pgbouncer:local
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    logging: *logging

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: boomerang
      CLICKHOUSE_USER: boomerang
      CLICKHOUSE_PASSWORD: boomerang
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/boomerang.xml:/etc/clickhouse-server/config.d/boomerang.xml:ro
    ports: ["8123:8123"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      retries: 30
    logging: *logging

  # S3-compatible object storage for large payloads (SeaweedFS; any S3 API works).
  s3:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=64", "-volume.max=8"]
    volumes:
      - s3-data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    logging: *logging

  # ---------------------------------------------------------------- one-shot setup
  init:
    <<: *backend
    build: ./backend
    restart: "no"
    command: ["init"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_started }
      s3: { condition: service_started }
    healthcheck: { disable: true }

  # ---------------------------------------------------------------- Boomerang services
  api:
    <<: *backend
    command: ["api"]
    deploy: { replicas: 2 }
    # The API drives the Infrastructure page's scale/kill buttons through the Docker socket.
    # Root is needed to use the socket; drop the mount (and SCALER) to run unprivileged.
    user: "0"
    environment:
      <<: *backend-env
      SCALER: docker
      COMPOSE_PROJECT: boomerang
      WORKER_SERVICE: worker
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]

  fanout:
    <<: *backend
    command: ["fanout"]

  worker:
    <<: *backend
    command: ["worker"]
    # Killed workers stay down so the dashboard can show partitions being reassigned.
    restart: "no"
    stop_grace_period: 40s
    deploy:
      replicas: 1
      # A per-worker CPU budget (like a pod limit) makes scaling out visibly add throughput.
      resources: { limits: { cpus: "0.5" } }

  retry:
    <<: *backend
    command: ["retry"]

  recorder:
    <<: *backend
    command: ["recorder"]

  realtime:
    <<: *backend
    command: ["realtime"]

  shopsim:
    <<: *backend
    command: ["shopsim"]

  receivers:
    <<: *backend
    command: ["receivers"]
    environment:
      <<: *backend-env
      HTTP_ADDR: ":9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./web
    image: boomerang-web:local
    restart: unless-stopped
    logging: *logging

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, realtime, shopsim, web]
    ports: ["8080:80"]
    volumes: ["./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    logging: *logging

  # ---------------------------------------------------------------- observability (opt-in)
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d", "--web.enable-lifecycle"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    user: "0"
    ports: ["9090:9090"]
    logging: *logging

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    logging: *logging

  loki:
    image: grafana/loki:3.3.1
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes: ["./deploy/loki/loki.yml:/etc/loki/loki.yml:ro"]
    logging: *logging

  promtail:
    image: grafana/promtail:3.3.1
    profiles: [observability]
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./deploy/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]
    logging: *logging

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  clickhouse-data:
  s3-data:
